# Phase 1 learning demo — nginx Deployment + Service in webchat-dev namespace.
# Apply: kubectl apply -f k8s/learning/nginx-demo.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: webchat-dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
  namespace: webchat-dev
  labels:
    app: nginx-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-demo
  template:
    metadata:
      labels:
        app: nginx-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-demo
  namespace: webchat-dev
spec:
  selector:
    app: nginx-demo
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
