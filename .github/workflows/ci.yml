# CI for webchat — quality gates and Docker build verification only.
# Registry push (GHCR) and CD to local Kubernetes stay on Jenkins.
name: CI
# When it runs (every PR and push to main reruns the same CI gates)
on:
  pull_request:
  push:

# Cancel the previous commit run, if there is a new one ahead
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Shared versions
env:
  JAVA_VERSION: "21"
  NODE_VERSION: "20"

jobs:
  # Job 1 - backend test
  backend-test:
    name: Backend (Maven test)
    # Fresh ubuntu VM per job
    runs-on: ubuntu-latest
    steps:
      # Clone the commit that triggered the run
      - name: Checkout
        uses: actions/checkout@v4

      # Install temurin 21 and maven cache
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # CI quality gate (-B = batch (non-interactive logs))
      # Launches all the tests
      - name: Run unit and integration tests
        run: mvn -B test

      # If tests fail - the repost is generated
      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/**"
          if-no-files-found: ignore

  # Frontend test run in parallel with backend
  frontend-test:
    name: Frontend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webchat_frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        # Installs via lockfile
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: webchat_frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Catch bugs before merge
      - name: Lint
        run: npm run lint

      # Vitest unit tests
      - name: Unit tests
        run: npm test

      # Proves Vite production build works
      - name: Production build
        run: npm run build

  docker-build:
    name: Docker (${{ matrix.name }})
    # Quality gate wiring, images are built only if both tests succeed
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest

    strategy:
      # If one fails, still try the others
      fail-fast: false
      matrix:
        include:
          - name: discovery-service
            context: .
            file: discovery-service/Dockerfile
          - name: user-service
            context: .
            file: user-service/Dockerfile
          - name: auth-service
            context: .
            file: auth-service/Dockerfile
          - name: chat-service
            context: .
            file: chat-service/Dockerfile
          - name: notification-service
            context: .
            file: notification-service/Dockerfile
          - name: api-gateway
            context: .
            file: api-gateway/Dockerfile
          - name: frontend
            context: webchat_frontend
            file: webchat_frontend/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Verify images build; registry push is handled by Jenkins (GHCR + local CD).
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: webchat/${{ matrix.name }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  ci-summary:
    name: CI summary
    needs: [backend-test, frontend-test, docker-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        # Prints to logs info about the result
        run: |
          echo "backend-test: ${{ needs.backend-test.result }}"
          echo "frontend-test: ${{ needs.frontend-test.result }}"
          echo "docker-build: ${{ needs.docker-build.result }}"
          if [ "${{ needs.backend-test.result }}" != "success" ] \
            || [ "${{ needs.frontend-test.result }}" != "success" ] \
            || [ "${{ needs.docker-build.result }}" != "success" ]; then
            echo "::error::CI failed — fix tests or Docker builds before merge."
            exit 1
          fi
          echo "All CI quality gates passed."
